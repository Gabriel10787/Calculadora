<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<title>Calculadora con JavaScript</title>
<link type="text/css" href="estilo.css" rel="stylesheet">
<script src="funcionalidad.js"></script>
</head>
<body onload="init();">
<table class="calculadora">
<tr>
  <td colspan="4">
    <div id="pantalla">
      <div id="expresion">
        <span id="operandoA"></span>
        <span id="operacionDisplay"></span>
        <span id="operandob"></span>
      </div>
      <div id="resultado"></div>
    </div>
  </td>
</tr>
<tr>
  <td colspan="4"><span id="curso">Calculadora DAW</span></td>
</tr>
<tr>
  <td><button id="porcentaje">%</button></td>
  <td><button id="borrarEntrada">CE</button></td>
  <td><button id="reset">C</button></td>
  <td><button id="backspace">⌫</button></td>
</tr>
<tr>
  <td><button id="inverso">1/x</button></td>
  <td><button id="potencia">x^2</button></td>
  <td><button id="raiz">√x</button></td>
  <td><button id="division">/</button></td>
</tr>
<tr>
  <td><button id="siete">7</button></td>
  <td><button id="ocho">8</button></td>
  <td><button id="nueve">9</button></td>
  <td><button id="multiplicacion">x</button></td>
</tr>

<tr>
  <td><button id="cuatro">4</button></td>
  <td><button id="cinco">5</button></td>
  <td><button id="seis">6</button></td>
  <td><button id="resta">-</button></td>
</tr>
<tr>
  <td><button id="uno">1</button></td>
  <td><button id="dos">2</button></td>
  <td><button id="tres">3</button></td>
  <td><button id="suma">+</button></td>
</tr>
<tr>
  <td><button id="cambioValor">+/-</button></td>
  <td><button id="cero">0</button></td>
  <td><button id="coma">,</button></td>
  <td><button id="igual">=</button></td>
</tr>
<tr>
  <td colspan="4"><span id="creditos">Hecho para mis alumn@s de GS</span></td>
</tr>
</table>
</body>
</html>
